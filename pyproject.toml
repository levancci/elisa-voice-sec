[project]
name = "elisa"
version = "0.1.0"
description = "Offline voice-biometric security prototype"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "numpy>=2.4.6",
    "kaldi-native-fbank==1.21.1",
    "onnx==1.20.1",
    "onnxruntime==1.23.2",
    "sounddevice==0.5.2",
    "soundfile==0.13.1",
    "torch>=2.14.0",
    "torchaudio>=2.11.0",
    "speechbrain>=1.1.1",
]

[dependency-groups]
dev = [
	"modelscope>=1.40.1",
	"pandas==2.3.3",
	"pytest==8.4.2",
	"ruff==0.13.2",
	"transformers==4.57.1",
	"vosk==0.3.45",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
